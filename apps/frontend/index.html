<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Placement Scanner</title>
    <link rel="icon" type="image/svg+xml" href="/camera-icon.svg" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; }
      #root { width: 100%; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #060d1a; color: #e2e8f0; }
      /* --app-h is set by JS to window.innerHeight, updated on resize/orientationchange.
         This avoids the iOS Safari 100vh-behind-address-bar bug.
         100dvh is used as the modern fallback for browsers that support it. */
      :root { --app-h: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      function setAppHeight() {
        document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
      }
      setAppHeight();
      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 100));
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
