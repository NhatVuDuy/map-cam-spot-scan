version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./apps/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/gis
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      OVERPASS_ENDPOINTS: https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter
      CACHE_TTL_SECONDS: 300
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data:ro

  frontend:
    build: ./apps/frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
